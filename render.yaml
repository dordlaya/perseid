services:
  - type: web
    name: perseid
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: STORE_BACKEND
        value: valkey
      - key: VALKEY_URL
        sync: false          # set manually in Render dashboard
      - key: VALKEY_PREFIX
        value: spacemap
    healthCheckPath: /api/health
